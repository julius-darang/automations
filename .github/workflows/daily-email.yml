name: Daily Brief & Market Update

on:
  schedule:
    - cron: '17 6 * * *'  # 06:17 UTC = 2:17pm PH; schedules can be delayed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  send-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare recipient list
        env:
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
        run: |
          if [ -n "$RECIPIENT_EMAILS" ]; then
            printf '%s\n' "$RECIPIENT_EMAILS" > recipients.txt
          fi

      - name: Send email
        run: python daily_updates.py
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          CITY: "Borongan City, Eastern Samar"
          LAT: "11.6083"
          LON: "125.4358"
          TIMEZONE: "Asia/Manila"
          AI_MODEL_IDS: ${{ vars.AI_MODEL_IDS }}

      - name: Ping optional delivery monitor
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: |
          if [ -n "$HEALTHCHECKS_PING_URL" ]; then
            curl --fail --silent --show-error --output /dev/null \
                 --connect-timeout 10 --max-time 20 --retry 2 \
                 "$HEALTHCHECKS_PING_URL" || \
              echo "::warning::Email sent, but delivery monitor ping failed. Do not resend the email."
          fi

      - name: Upload fallback email
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-fallback-${{ github.run_id }}
          path: "email_fallback_*.txt"
          retention-days: 30
          if-no-files-found: ignore

      - name: Notify on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::warning::NTFY_TOPIC is not configured; skipping failure notification."
            exit 0
          fi
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
               -H "Title: Daily Brief Failed" \
               -H "Priority: high" \
               -H "Tags: warning" \
               -d "The daily brief automation failed at $(date -u). Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
               "https://ntfy.sh/${NTFY_TOPIC}"
