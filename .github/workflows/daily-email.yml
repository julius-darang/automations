name: Daily Brief & Market Update

on:
  schedule:
    - cron: '0 6 * * *'  # 6am UTC = 2pm PH (UTC+8)
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send email
        run: python daily_updates.py
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          CITY: "Borongan City, Eastern Samar"
          LAT: "11.6083"
          LON: "125.4358"
          TIMEZONE: "Asia/Manila"

      - name: Upload fallback email
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-fallback-${{ github.run_id }}
          path: "email_fallback_*.txt"
          retention-days: 30
          if-no-files-found: ignore

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -H "Title: Daily Brief Failed" \
               -H "Priority: high" \
               -H "Tags: warning" \
               -d "The daily brief automation failed at $(date -u). Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
               https://ntfy.sh/daily-brief-julius
