  LAT: "11.6083"
  LON: "125.4358"
  TIMEZONE: "Asia/Manila"
  FX_BASE: "USD"
  FX_QUOTE: "PHP"
  HOLIDAY_COUNTRY: "PH"
  REDDIT_SUBREDDITS: "technology,programming"
  SEMANTIC_SCHOLAR_QUERY: "artificial intelligence"
  SEMANTIC_SCHOLAR_LIMIT: 5
  GITHUB_TRENDING_SINCE: "daily"
  GITHUB_TRENDING_LANGUAGE: ""
  GITHUB_TRENDING_LIMIT: 5
  PRODUCT_HUNT_LIMIT: 5

# AI news runs daily; pricing defaults to Mondays. Use --pricing to override.
schedules:
  ai_pricing:
    - monday
